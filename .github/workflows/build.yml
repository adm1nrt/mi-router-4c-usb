name: Build Xiaomi Mi Router 4C USB Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'patches/**'
      - 'files/**'
      - 'github-overlay/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    name: OpenWrt 25.12.5 USB Host + Router AI
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout build configuration
        uses: actions/checkout@v4

      - name: Validate build inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f patches/001-enable-usb-host.patch
          test -f patches/002-add-usb-and-awg-packages.patch
          test -f github-overlay/ai-python.config
          echo "Required patches and Router AI package config found."

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git \
            libncurses-dev libssl-dev python3 \
            python3-setuptools rsync swig unzip \
            zlib1g-dev file wget curl time \
            ccache libelf-dev ecj fastjar

      - name: Download OpenWrt source
        run: |
          git clone --depth 1 --branch v25.12.5 \
            https://git.openwrt.org/openwrt/openwrt.git openwrt

      - name: Apply USB Host patches
        working-directory: openwrt
        run: |
          set -e
          git apply --check ../patches/001-enable-usb-host.patch
          git apply ../patches/001-enable-usb-host.patch
          git apply --check ../patches/002-add-usb-and-awg-packages.patch
          git apply ../patches/002-add-usb-and-awg-packages.patch

      - name: Add AmneziaWG source packages
        working-directory: openwrt
        run: |
          set -e
          git clone --depth 1 \
            https://github.com/Slava-Shchipunov/awg-openwrt.git awg-src
          cp -a awg-src/amneziawg-tools package/
          cp -a awg-src/kmod-amneziawg package/
          cp -a awg-src/luci-proto-amneziawg package/

      - name: Prepare OpenWrt feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure Xiaomi Mi Router 4C
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          cat > .config <<'EOF'
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt76x8=y
          CONFIG_TARGET_ramips_mt76x8_DEVICE_xiaomi_mi-router-4c=y

          CONFIG_PACKAGE_kmod-usb2=y
          CONFIG_PACKAGE_kmod-usb-ohci=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_e2fsprogs=y

          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y

          CONFIG_PACKAGE_kmod-amneziawg=y
          CONFIG_PACKAGE_amneziawg-tools=y
          CONFIG_PACKAGE_luci-proto-amneziawg=y

          CONFIG_PACKAGE_kmod-wireguard=y
          CONFIG_PACKAGE_wireguard-tools=y

          CONFIG_PACKAGE_python3-base=y
          CONFIG_PACKAGE_python3-light=y
          CONFIG_PACKAGE_python3-ssl=y
          CONFIG_PACKAGE_python3-urllib=y
          CONFIG_PACKAGE_python3-logging=y
          CONFIG_PACKAGE_python3-email=y
          CONFIG_PACKAGE_ca-bundle=y
          CONFIG_PACKAGE_ca-certificates=y
          EOF

          echo "Adding Router AI Python configuration..."
          cat ../github-overlay/ai-python.config >> .config

          make defconfig

          echo "Selected Python/TLS/USB/VPN packages:"
          grep -E '^(CONFIG_PACKAGE_(python3|libpython3|ca-bundle|ca-certificates|kmod-usb|kmod-fs-ext4|block-mount|wireguard|kmod-wireguard|kmod-amneziawg|amneziawg))' .config || true

      - name: Download package sources
        working-directory: openwrt
        run: |
          make download -j4

      - name: Build firmware
        working-directory: openwrt
        run: |
          make -j"$(nproc)" V=s

      - name: Verify firmware
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          IMAGE=$(find bin/targets/ramips/mt76x8 \
            -maxdepth 1 \
            -name '*xiaomi_mi-router-4c*squashfs-sysupgrade.bin' \
            -print -quit)

          if [ -z "$IMAGE" ]; then
            echo "ERROR: Xiaomi Mi Router 4C sysupgrade image not found"
            exit 1
          fi

          SIZE=$(stat -c%s "$IMAGE")
          echo "Firmware: $IMAGE"
          echo "Size: $SIZE bytes"
          sha256sum "$IMAGE" | tee firmware.sha256

          mkdir -p ../firmware-output
          cp "$IMAGE" ../firmware-output/
          cp firmware.sha256 ../firmware-output/

      - name: Collect kernel modules and build metadata
        working-directory: openwrt
        shell: bash
        run: |
          set -euo pipefail

          OUT="../modules-output"
          mkdir -p "$OUT"

          for pkg in kmod-tun kmod-inet-diag kmod-nft-tproxy; do
            FILE=$(find bin -type f -name "${pkg}-*.apk" -print -quit)
            if [ -z "$FILE" ]; then
              echo "ERROR: $pkg APK not found"
              find bin -type f -iname "*${pkg}*" || true
              exit 1
            fi
            cp "$FILE" "$OUT/"
          done

          find bin -type f -name 'kernel-*.apk' -exec cp {} "$OUT/" \;
          cp .config "$OUT/openwrt.config"

          KERNEL_CONFIG=$(find build_dir -type f -path '*/linux-*/.config' -print -quit)
          if [ -n "$KERNEL_CONFIG" ]; then
            cp "$KERNEL_CONFIG" "$OUT/kernel.config"
          fi

          find bin -type f \( -name 'Packages.adb' -o -name 'Packages.manifest' \) \
            -exec cp {} "$OUT/" \;

          {
            echo "OpenWrt source commit:"
            git rev-parse HEAD
            echo
            echo "Kernel configuration:"
            grep -E 'CONFIG_LINUX_(VERSION|KERNEL)' .config || true
            echo
            echo "Target configuration:"
            grep -E '^CONFIG_TARGET_' .config || true
          } > "$OUT/build-info.txt"

          cd "$OUT"
          if compgen -G '*.apk' > /dev/null; then
            sha256sum *.apk > SHA256SUMS
          fi
          ls -lh

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Mi-Router-4C-USB-OpenWrt-25.12.5
          path: firmware-output/*
          retention-days: 30
          if-no-files-found: error

      - name: Upload kernel modules artifact
        uses: actions/upload-artifact@v4
        with:
          name: Xiaomi-Mi-Router-4C-Kernel-Modules
          path: modules-output/*
          retention-days: 30
          if-no-files-found: error
